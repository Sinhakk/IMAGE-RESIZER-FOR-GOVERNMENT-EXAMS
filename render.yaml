services:
  - type: web
    name: image-utility-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false          # Render dashboard mein manually daalo
      - key: ADMIN_IDS
        sync: false          # e.g. "123456789"
      - key: UID_SALT
        generateValue: true  # auto random secure salt
      - key: DB_PATH
        value: /tmp/imagebot.db
